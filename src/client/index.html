<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window Stream</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: transparent; }
  :root {
    --bg: #0C0E11; --surface: #141720; --border: #1E2433;
    --accent: #00D4FF; --text: #E8ECF4; --muted: #5A6480;
    --green: #00E5A0; --red: #FF5A5A;
  }
  body {
    background: transparent; color: var(--text);
    font-family: 'JetBrains Mono','Courier New',monospace;
    font-size: 12px;
    height: 100vh; overflow: hidden; user-select: none;
    /* drag the frameless window by default; canvas area will override */
    -webkit-app-region: drag;
  }

  /* ── Bottom-left HUD ──────────────────────────────────────────────────── */
  #hud {
    position: fixed; bottom: 14px; left: 14px; z-index: 30;
    display: flex; flex-direction: column; gap: 6px;
    -webkit-app-region: no-drag; /* interactive */
  }

  /* info row: dot + status + fps + zoom + window tabs */
  #hud-info {
    display: flex; align-items: center; gap: 8px;
    background: rgba(12,14,17,.72); border: 1px solid var(--border);
    border-radius: 5px; padding: 5px 10px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0; transition: background .2s;
  }
  #status-dot.connected { background: var(--green); }
  #status-dot.error     { background: var(--red); }
  #status-text { color: var(--muted); }
  #fps-counter { color: var(--accent); min-width: 44px; }
  #zoom-label  { color: var(--muted); min-width: 40px; }

  /* connect row: url input + buttons */
  #hud-connect {
    display: flex; align-items: center; gap: 6px;
    background: rgba(12,14,17,.72); border: 1px solid var(--border);
    border-radius: 5px; padding: 5px 10px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #server-url {
    background: transparent; border: none; outline: none;
    color: var(--text); font-family: inherit; font-size: 11px;
    width: 190px;
  }
  .btn {
    background: var(--accent); color: var(--bg); border: none;
    font-family: inherit; font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 3px; cursor: pointer;
  }
  .btn:hover { opacity: .85; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }

  #viewport {
    position: fixed; inset: 0;
    background: transparent; outline: none;
    cursor: default;
    -webkit-app-region: no-drag;
  }
  #viewport.passthrough { cursor: none; }
  #viewport.passthrough #stream-canvas {
    outline: 2px solid var(--accent); outline-offset: -2px;
  }

  #stream-canvas {
    position: absolute; top: 0; left: 0; display: block;
    image-rendering: pixelated; transform-origin: 0 0; will-change: transform;
  }

  /* Virtual cursor — visible only in passthrough mode */
  #vcursor {
    position: absolute; pointer-events: none; z-index: 20;
    display: none; width: 16px; height: 22px;
    /* tip at 0,0 — positioned by left/top */
    filter: drop-shadow(0.5px 0.5px 0.5px rgba(0,0,0,0.5));
  }
  #viewport.passthrough #vcursor { display: block; }

  #zoom-hint {
    position: absolute; bottom: 14px; right: 14px;
    background: rgba(12,14,17,.88); border: 1px solid var(--border);
    border-radius: 4px; padding: 5px 9px; font-size: 11px;
    color: var(--muted); pointer-events: none;
    opacity: 0; transition: opacity .25s; z-index: 10;
  }
  #zoom-hint.show { opacity: 1; }

  #pt-badge {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,212,255,.12); border: 1px solid var(--accent);
    border-radius: 4px; padding: 3px 10px; font-size: 10px;
    color: var(--accent); pointer-events: none;
    opacity: 0; transition: opacity .2s; z-index: 10;
  }
  #pt-badge.show { opacity: 1; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
</head>
<body>

<div id="viewport" tabindex="0">
  <canvas id="stream-canvas"></canvas>

  <!-- Native macOS-style cursor -->
  <svg id="vcursor" viewBox="0 0 16 22" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="shadow">
        <feDropShadow dx="0.3" dy="0.3" stdDeviation="0.3" flood-opacity="0.5"/>
      </filter>
    </defs>
    <path d="M 1 1 L 1 16 L 5 12 L 8 19 L 10 18 L 7 11 L 12 11 Z"
          fill="black" stroke="white" stroke-width="0.6" stroke-linejoin="miter" filter="url(#shadow)"/>
  </svg>

  <div id="zoom-hint"></div>
  <div id="pt-badge">click outside to exit · Esc</div>
</div>

<!-- ── Bottom-left HUD ───────────────────────────────────────────────────── -->
<div id="hud">
  <div id="hud-info">
    <div id="status-dot"></div>
    <span id="status-text">disconnected</span>
    <span id="fps-counter">0 fps</span>
    <span id="zoom-label">100%</span>
    <span id="window-indicator" style="color: var(--muted); font-size: 11px;"></span>
    <button class="btn btn-ghost" id="zoom-fit-btn">fit</button>
    <button class="btn btn-ghost" id="zoom-1x-btn">1×</button>
  </div>
  <div id="hud-connect">
    <input id="server-url" type="text" value="ws://127.0.0.1:8766" spellcheck="false">
    <button class="btn" id="connect-btn">Connect</button>
  </div>
</div>

<script>
'use strict';

// ── DOM refs ──────────────────────────────────────────────────────────────────
const canvas    = document.getElementById('stream-canvas');
const ctx2d     = canvas.getContext('2d');
const viewport  = document.getElementById('viewport');
const dot       = document.getElementById('status-dot');
const statusT   = document.getElementById('status-text');
const fpsEl     = document.getElementById('fps-counter');
const zoomLabel = document.getElementById('zoom-label');
const vcursor   = document.getElementById('vcursor');
const zoomHint  = document.getElementById('zoom-hint');
const ptBadge   = document.getElementById('pt-badge');
const windowIndicator = document.getElementById('window-indicator');

// ── FPS counter ───────────────────────────────────────────────────────────────
let frameCount = 0;
setInterval(() => { fpsEl.textContent = frameCount + ' fps'; frameCount = 0; }, 1000);

// ── WebSocket / decoder ───────────────────────────────────────────────────────
let ws = null;
const windowMetas = new Map(); // windowID → meta object
const activeWindows = new Map(); // windowID → { lastSeen, decoder, spsCache, ppsCache, codecConfigured, firstFrame }
let selectedWindowID = null;

// Always returns the selected window's meta (used in coordinate mapping)
function windowMeta() { return selectedWindowID != null ? windowMetas.get(selectedWindowID) : null; }

function makeWindowState(windowID) {
  const state = { windowID, lastSeen: Date.now(), decoder: null, spsCache: null, ppsCache: null, codecConfigured: false, firstFrame: true, renderCount: 0 };
  state.decoder = new VideoDecoder({
    output: (frame) => {
      // Only render if this is the selected window
      const selected = activeWindows.get(selectedWindowID);
      if (state !== selected) { frame.close(); return; }
      if (state.renderCount < 3) {
        console.log(`[render] wid=${state.windowID} selected=${selectedWindowID} frame#${state.renderCount}`);
        state.renderCount++;
      }
      const w = frame.displayWidth, h = frame.displayHeight;
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w; canvas.height = h;
        if (!state.firstFrame) fitToViewport();
        state.firstFrame = false;
      }
      ctx2d.drawImage(frame, 0, 0);
      frame.close();
      frameCount++;
    },
    error: (e) => { console.warn('[decoder]', e); state.codecConfigured = false; setTimeout(() => resetWindowState(state), 300); },
  });
  return state;
}

function resetWindowState(state) {
  if (state.decoder) { try { state.decoder.close(); } catch {} }
  state.decoder = null; state.spsCache = null; state.ppsCache = null;
  state.codecConfigured = false; state.firstFrame = true;
  // Recreate decoder
  state.decoder = new VideoDecoder({
    output: (frame) => {
      if (state !== activeWindows.get(selectedWindowID)) { frame.close(); return; }
      const w = frame.displayWidth, h = frame.displayHeight;
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; if (!state.firstFrame) fitToViewport(); state.firstFrame = false; }
      ctx2d.drawImage(frame, 0, 0); frame.close(); frameCount++;
    },
    error: (e) => { console.warn('[decoder]', e); state.codecConfigured = false; setTimeout(() => resetWindowState(state), 300); },
  });
}

function connect() {
  const url = document.getElementById('server-url').value.trim();
  if (ws) { ws.close(); ws = null; }
  setStatus('connecting…', '');
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  ws.onopen    = () => {
    setStatus('connected', 'connected');
    // Clear stale window state on reconnect
    for (const s of activeWindows.values()) { try { s.decoder?.close(); } catch {} }
    activeWindows.clear();
    selectedWindowID = null;
  };
  ws.onmessage = e => {
    if (typeof e.data === 'string') {
      handleMeta(e.data);
    } else {
      const bytes = new Uint8Array(e.data);
      if (bytes.length >= 4) {
        const view = new DataView(bytes.buffer, bytes.byteOffset, 4);
        const wid = view.getUint32(0, true); // little-endian
        handleFrame(bytes.subarray(4), wid);
      }
    }
  };
  ws.onerror   = () => setStatus('error', 'error');
  ws.onclose   = () => { setStatus('disconnected', ''); ws = null; };
}
document.getElementById('connect-btn').addEventListener('click', connect);

function setStatus(t, cls) { statusT.textContent = t; dot.className = cls; }

function sendInput(obj) {
  if (ws?.readyState !== WebSocket.OPEN) return;
  const m = windowMeta();
  if (m?.windowID && obj.windowID == null) obj.windowID = m.windowID;
  ws.send(JSON.stringify(obj));
}

// ── Meta ──────────────────────────────────────────────────────────────────────
function handleMeta(text) {
  try {
    const m = JSON.parse(text);
    if (m.type === 'meta' && m.windowID) windowMetas.set(m.windowID, m);
  } catch {}
}

function updateWindowIndicator() {
  const count = activeWindows.size;
  if (count === 0) {
    windowIndicator.textContent = '';
    windowIndicator.innerHTML = '';
  } else if (count === 1) {
    windowIndicator.textContent = `window ${selectedWindowID}`;
  } else {
    // Show clickable tabs
    const tabs = Array.from(activeWindows.keys())
      .map(wid => {
        const isSelected = wid === selectedWindowID;
        const style = isSelected
          ? 'color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline;'
          : 'color: var(--muted); cursor: pointer;';
        return `<span style="${style}" data-wid="${wid}">${wid}</span>`;
      })
      .join(' | ');
    windowIndicator.innerHTML = tabs;

    // Add click handlers
    windowIndicator.querySelectorAll('[data-wid]').forEach(el => {
      el.addEventListener('click', () => {
        const newWid = parseInt(el.dataset.wid);
        if (newWid === selectedWindowID) return;
        console.log('[switch] from', selectedWindowID, '→', newWid, 'activeWindows:', [...activeWindows.keys()]);
        selectedWindowID = newWid;
        updateWindowIndicator();
      });
    });
  }
}

// ── H.264 decoder ─────────────────────────────────────────────────────────────
// Draw immediately in the output callback — don't buffer to rAF.
// This removes one frame of latency vs the pendingFrame pattern.

function splitNalUnits(data) {
  const units = []; let start = -1;
  for (let i = 0; i < data.length; i++) {
    if (i+3 < data.length && data[i]===0&&data[i+1]===0&&data[i+2]===0&&data[i+3]===1) {
      if (start >= 0) units.push(data.subarray(start, i)); start = i+4; i+=3;
    } else if (i+2 < data.length && data[i]===0&&data[i+1]===0&&data[i+2]===1) {
      if (start >= 0) units.push(data.subarray(start, i)); start = i+3; i+=2;
    }
  }
  if (start >= 0 && start < data.length) units.push(data.subarray(start));
  return units;
}

function buildAvcc(sps, pps) {
  const buf = new Uint8Array(11 + sps.length + pps.length); let o = 0;
  buf[o++]=1; buf[o++]=sps[1]; buf[o++]=sps[2]; buf[o++]=sps[3];
  buf[o++]=0xff; buf[o++]=0xe1;
  buf[o++]=(sps.length>>8)&0xff; buf[o++]=sps.length&0xff;
  buf.set(sps,o); o+=sps.length; buf[o++]=1;
  buf[o++]=(pps.length>>8)&0xff; buf[o++]=pps.length&0xff;
  buf.set(pps,o); return buf.buffer;
}

function spsToCodec(sps) {
  if (sps.length < 4) return 'avc1.640028';
  return `avc1.${sps[1].toString(16).padStart(2,'0')}${sps[2].toString(16).padStart(2,'0')}${sps[3].toString(16).padStart(2,'0')}`;
}

function handleFrame(data, frameWindowID) {
  // Ensure per-window state exists
  let st = activeWindows.get(frameWindowID);
  if (!st) {
    st = makeWindowState(frameWindowID);
    activeWindows.set(frameWindowID, st);

    // Auto-select first window seen
    if (selectedWindowID == null) {
      selectedWindowID = frameWindowID;
      updateWindowIndicator();
    } else {
      updateWindowIndicator(); // refresh tabs to show new window
    }
  } else {
    st.lastSeen = Date.now();
  }

  // Always decode all windows so their decoders stay warm; rendering is gated in makeWindowState
  const dec = st.decoder;
  if (!dec || dec.state === 'closed') return;
  if (dec.decodeQueueSize > 2) return;

  const nals = splitNalUnits(data);
  let sps = null, pps = null; const vcl = [];
  for (const n of nals) {
    if (!n.length) continue;
    const t = n[0] & 0x1f;
    if (t === 7) sps = n; else if (t === 8) pps = n; else vcl.push(n);
  }

  // Only reconfigure when SPS/PPS actually change
  if (sps && pps) {
    const spsHex = Array.from(sps).map(x=>x.toString(16).padStart(2,'0')).join('');
    const ppsHex = Array.from(pps).map(x=>x.toString(16).padStart(2,'0')).join('');
    if (spsHex !== st.spsCache || ppsHex !== st.ppsCache) {
      st.spsCache = spsHex;
      st.ppsCache = ppsHex;
      try {
        dec.configure({ codec: spsToCodec(sps), description: buildAvcc(sps, pps),
          optimizeForLatency: true, hardwareAcceleration: 'prefer-hardware' });
        st.codecConfigured = true;
      } catch(e) { return; }
    } else {
      st.codecConfigured = true;
    }
  }
  if (!st.codecConfigured || !vcl.length) return;

  let total = 0; for (const u of vcl) total += 4 + u.length;
  const avcc = new Uint8Array(total); let off = 0;
  for (const u of vcl) {
    const l = u.length;
    avcc[off++]=(l>>24)&0xff; avcc[off++]=(l>>16)&0xff; avcc[off++]=(l>>8)&0xff; avcc[off++]=l&0xff;
    avcc.set(u, off); off += l;
  }
  const isKey = vcl.some(u => (u[0]&0x1f) === 5);
  try { dec.decode(new EncodedVideoChunk({ type: isKey?'key':'delta',
    timestamp: performance.now()*1000, data: avcc })); }
  catch(e) { st.codecConfigured = false; }
}

// ── Viewport transform ────────────────────────────────────────────────────────
let zoom = 1, panX = 0, panY = 0;
const MIN_ZOOM = 0.05, MAX_ZOOM = 8;

function applyTransform() {
  canvas.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
  zoomLabel.textContent = Math.round(zoom * 100) + '%';
}

function fitToViewport() {
  if (!canvas.width || !canvas.height) return;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  zoom = Math.min(vw / canvas.width, vh / canvas.height);
  panX = (vw - canvas.width  * zoom) / 2;
  panY = (vh - canvas.height * zoom) / 2;
  applyTransform();
}

function resetZoom() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  zoom = 1;
  panX = (vw - canvas.width)  / 2;
  panY = (vh - canvas.height) / 2;
  applyTransform();
}

function zoomAt(px, py, factor) {
  const nz = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
  if (nz === zoom) return;
  const cx = (px - panX) / zoom, cy = (py - panY) / zoom;
  zoom = nz; panX = px - cx * zoom; panY = py - cy * zoom;
  applyTransform(); showZoomHint();
}

let zoomHintTimer = null;
function showZoomHint() {
  zoomHint.textContent = Math.round(zoom * 100) + '%';
  zoomHint.classList.add('show');
  clearTimeout(zoomHintTimer);
  zoomHintTimer = setTimeout(() => zoomHint.classList.remove('show'), 800);
}

document.getElementById('zoom-fit-btn').addEventListener('click', fitToViewport);
document.getElementById('zoom-1x-btn').addEventListener('click', resetZoom);

// ── Coordinate mapping ────────────────────────────────────────────────────────
function viewportToCanvas(vx, vy) {
  return { cx: (vx - panX) / zoom, cy: (vy - panY) / zoom };
}

function canvasToScreen(cx, cy) {
  const m = windowMeta();
  if (!m) return null;
  const s = m.contentScale || 1;
  return { x: m.originX + cx / s, y: m.originY + cy / s };
}

function eventToScreen(e) {
  const r = viewport.getBoundingClientRect();
  const { cx, cy } = viewportToCanvas(e.clientX - r.left, e.clientY - r.top);
  return canvasToScreen(cx, cy);
}

function isOverCanvas(vx, vy) {
  const { cx, cy } = viewportToCanvas(vx, vy);
  return cx >= 0 && cy >= 0 && cx <= canvas.width && cy <= canvas.height;
}

// ── Passthrough mode ──────────────────────────────────────────────────────────
let passthrough = false;

function enterPassthrough() {
  if (passthrough) return;
  passthrough = true;
  viewport.classList.add('passthrough');
  ptBadge.classList.add('show');
  viewport.focus();
  // Tell bridge to focus the target window once
  sendInput({ type: 'enterfocus' });
}

function exitPassthrough() {
  if (!passthrough) return;
  passthrough = false;
  viewport.classList.remove('passthrough');
  ptBadge.classList.remove('show');
  vcursor.style.left = '-100px';
}

// ── Move cursor overlay ───────────────────────────────────────────────────────
function setVCursor(e) {
  if (!passthrough) return;
  const r = viewport.getBoundingClientRect();
  vcursor.style.left = (e.clientX - r.left) + 'px';
  vcursor.style.top  = (e.clientY - r.top)  + 'px';
}

// ── Coalesced mousemove → rAF pump ────────────────────────────────────────────
// Trackpads fire mousemove at up to 1 kHz. We coalesce to display refresh rate
// to avoid flooding InputBridge and creating a backlog on the receive thread.
let pendingMove = null;

function pumpMoves() {
  if (pendingMove && passthrough) {
    sendInput({ type: 'mousemove', x: pendingMove.x, y: pendingMove.y });
    pendingMove = null;
  }
  requestAnimationFrame(pumpMoves);
}
requestAnimationFrame(pumpMoves);

// ── Window-move drag ──────────────────────────────────────────────────────────
let isMovingWindow = false, moveStartMouse = null, moveStartOrigin = null;

const TITLE_BAR_H = 28; // logical pts
function isTitleBar(e) {
  if (!windowMeta()) return false;
  const r = viewport.getBoundingClientRect();
  const { cy } = viewportToCanvas(e.clientX - r.left, e.clientY - r.top);
  return (cy / (windowMeta().contentScale || 1)) < TITLE_BAR_H;
}

// ── Pan state (only when NOT in passthrough) ──────────────────────────────────
let isPanning = false, panStart = null, panOrigin = null;

// ── Modifier helper ───────────────────────────────────────────────────────────
function mods(e) {
  const m = [];
  if (e.shiftKey) m.push('shift'); if (e.ctrlKey)  m.push('ctrl');
  if (e.altKey)   m.push('alt');   if (e.metaKey)  m.push('meta');
  return m;
}

// ── Pointer events ────────────────────────────────────────────────────────────
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const r = viewport.getBoundingClientRect();
  const vx = e.clientX - r.left, vy = e.clientY - r.top;

  if (passthrough) {
    // Forward scroll to real app
    const pt = eventToScreen(e);
    if (pt) sendInput({ type: 'scroll', x: pt.x, y: pt.y, deltaX: e.deltaX, deltaY: e.deltaY });
    return;
  }

  if (e.ctrlKey) {
    // Pinch-to-zoom
    zoomAt(vx, vy, 1 - e.deltaY * 0.01);
    return;
  }
  // Two-finger pan
  panX -= e.deltaX; panY -= e.deltaY;
  applyTransform();
}, { passive: false });

viewport.addEventListener('mousedown', e => {
  e.preventDefault();
  viewport.focus();
  const r = viewport.getBoundingClientRect();
  const vx = e.clientX - r.left, vy = e.clientY - r.top;
  const over = isOverCanvas(vx, vy);

  if (passthrough) {
    if (!over) { exitPassthrough(); return; }

    if (isTitleBar(e)) {
      isMovingWindow = true;
      moveStartMouse  = { x: e.screenX, y: e.screenY };
      moveStartOrigin = windowMeta() ? { x: windowMeta().originX, y: windowMeta().originY } : null;
      return;
    }

    const pt = eventToScreen(e);
    if (pt) sendInput({ type: 'mousedown', x: pt.x, y: pt.y,
                        button: e.button, modifiers: mods(e) });
    return;
  }

  // Not in passthrough
  if (over) {
    enterPassthrough();
    if (isTitleBar(e)) {
      isMovingWindow = true;
      moveStartMouse  = { x: e.screenX, y: e.screenY };
      moveStartOrigin = windowMeta() ? { x: windowMeta().originX, y: windowMeta().originY } : null;
      return;
    }
    const pt = eventToScreen(e);
    if (pt) sendInput({ type: 'mousedown', x: pt.x, y: pt.y,
                        button: e.button, modifiers: mods(e) });
    return;
  }

  // Drag on empty space = pan
  isPanning = true;
  panStart  = { x: e.clientX, y: e.clientY };
  panOrigin = { x: panX, y: panY };
  viewport.style.cursor = 'grabbing';
});

viewport.addEventListener('mousemove', e => {
  setVCursor(e);

  if (isMovingWindow && moveStartOrigin) {
    const dx = e.screenX - moveStartMouse.x;
    const dy = e.screenY - moveStartMouse.y;
    sendInput({ type: 'move', windowID: windowMeta()?.windowID,
                x: moveStartOrigin.x + dx, y: moveStartOrigin.y + dy });
    return;
  }

  if (isPanning) {
    panX = panOrigin.x + (e.clientX - panStart.x);
    panY = panOrigin.y + (e.clientY - panStart.y);
    applyTransform();
    return;
  }

  if (passthrough) {
    const pt = eventToScreen(e);
    if (pt) pendingMove = pt;   // coalesced; sent on next rAF tick
  }
});

viewport.addEventListener('mouseup', e => {
  if (isMovingWindow) { isMovingWindow = false; return; }
  if (isPanning) { isPanning = false; viewport.style.cursor = ''; return; }
  if (!passthrough) return;
  const pt = eventToScreen(e);
  if (pt) sendInput({ type: 'mouseup', x: pt.x, y: pt.y,
                      button: e.button, modifiers: mods(e) });
});

viewport.addEventListener('mouseleave', () => {
  if (isPanning) { isPanning = false; viewport.style.cursor = ''; }
});

viewport.addEventListener('contextmenu', e => e.preventDefault());

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { exitPassthrough(); return; }

  if (passthrough) {
    e.preventDefault();
    sendInput({ type: 'keydown', keyCode: e.keyCode, key: e.key, modifiers: mods(e) });
    return;
  }

  if (document.activeElement?.tagName === 'INPUT') return;
  if (e.code === 'KeyF') { fitToViewport(); return; }
  if (e.code === 'Digit0' || e.code === 'Numpad0') { resetZoom(); return; }
  const vx = viewport.clientWidth / 2, vy = viewport.clientHeight / 2;
  if (e.code === 'Equal' || e.code === 'NumpadAdd')      { zoomAt(vx, vy, 1.1); return; }
  if (e.code === 'Minus' || e.code === 'NumpadSubtract') { zoomAt(vx, vy, 0.9); return; }
});

document.addEventListener('keyup', e => {
  if (!passthrough || e.code === 'Escape') return;
  sendInput({ type: 'keyup', keyCode: e.keyCode, key: e.key, modifiers: mods(e) });
});

viewport.setAttribute('tabindex', '0');
connect();
</script>
</body>
</html>
