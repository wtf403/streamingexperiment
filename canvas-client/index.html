<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window Stream</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0C0E11;
    --surface: #141720;
    --border: #1E2433;
    --accent: #00D4FF;
    --text: #E8ECF4;
    --muted: #5A6480;
    --green: #00E5A0;
    --red: #FF5A5A;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  #toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.2s;
  }
  #status-dot.connected { background: var(--green); }
  #status-dot.error { background: var(--red); }

  #status-text { color: var(--muted); flex: 1; }
  #fps-counter { color: var(--accent); }

  #server-url {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 3px;
    width: 200px;
  }

  #connect-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
  }
  #connect-btn:hover { opacity: 0.85; }
  #connect-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #canvas-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
    cursor: none;
    background: #000;
  }

  #stream-canvas {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
  }

  #cursor-overlay {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: opacity 0.1s;
    opacity: 0;
  }

  #info-overlay {
    position: absolute;
    bottom: 10px;
    left: 10px;
    background: rgba(12, 14, 17, 0.85);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 10px;
    color: var(--muted);
    pointer-events: none;
    line-height: 1.7;
    max-width: 280px;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
</head>
<body>

<div id="toolbar">
  <div id="status-dot"></div>
  <span id="status-text">disconnected</span>
  <span id="fps-counter">0 fps</span>
  <input id="server-url" type="text" value="ws://127.0.0.1:8766" spellcheck="false">
  <button id="connect-btn">Connect</button>
</div>

<div id="canvas-wrap">
  <canvas id="stream-canvas"></canvas>
  <div id="cursor-overlay"></div>
  <div id="info-overlay">
    <div id="meta-info">no window metadata yet</div>
    <div>click / key / scroll / drag → native window</div>
  </div>
</div>

<script>
'use strict';

// ── State ──────────────────────────────────────────────────────────────────

const canvas  = document.getElementById('stream-canvas');
const ctx     = canvas.getContext('2d');
const cursor  = document.getElementById('cursor-overlay');
const wrap    = document.getElementById('canvas-wrap');
const dot     = document.getElementById('status-dot');
const statusT = document.getElementById('status-text');
const fpsEl   = document.getElementById('fps-counter');
const metaEl  = document.getElementById('meta-info');

let ws = null;
let decoder = null;
let windowMeta = null;   // { windowID, originX, originY, width, height, contentScale }
let frameCount = 0;
let fps = 0;
let lastFrameTime = 0;
let pendingH264 = new Uint8Array(0);  // accumulate NAL bytes
let pendingFrame = null;  // latest decoded frame waiting to be drawn

// Track drag state for window move
let isDragging = false;
let dragStartCanvas = null;
let dragStartMeta = null;
const CHROME_HEIGHT = 28;  // approximate macOS title bar height in points

setInterval(() => {
  fps = frameCount;
  frameCount = 0;
  fpsEl.textContent = fps + ' fps';
}, 1000);

// ── WebSocket ──────────────────────────────────────────────────────────────

function connect() {
  const url = document.getElementById('server-url').value.trim();
  if (ws) { ws.close(); ws = null; }

  setStatus('connecting…', '');
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    setStatus('connected', 'connected');
    initDecoder();
  };

  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      handleMeta(e.data);
    } else {
      handleFrame(new Uint8Array(e.data));
    }
  };

  ws.onerror = () => setStatus('error', 'error');
  ws.onclose = () => { setStatus('disconnected', ''); ws = null; };
}

function setStatus(text, cls) {
  statusT.textContent = text;
  dot.className = cls;
}

function sendInput(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

// ── Meta handling ──────────────────────────────────────────────────────────

function handleMeta(text) {
  try {
    const m = JSON.parse(text);
    if (m.type === 'meta') {
      windowMeta = m;
      metaEl.textContent = `win=${m.windowID}  ${m.width}×${m.height}  @(${m.originX.toFixed(0)},${m.originY.toFixed(0)})  scale=${m.contentScale}`;
    }
  } catch {}
}

// ── H264 decode ────────────────────────────────────────────────────────────

function initDecoder() {
  if (decoder) { try { decoder.close(); } catch {} }

  decoder = new VideoDecoder({
    output: (frame) => {
      // Store latest frame, close previous
      if (pendingFrame) pendingFrame.close();
      pendingFrame = frame;
    },
    error: (e) => {
      console.warn('VideoDecoder error:', e);
      // re-init on error
      setTimeout(initDecoder, 500);
    }
  });

  decoder.configure({
    codec: 'avc1.640028',   // H264 High Profile Level 4.0 (will be updated from SPS)
    optimizeForLatency: true,
  });
}

// Annex B NAL unit splitter
function splitNalUnits(data) {
  const units = [];
  let start = -1;
  for (let i = 0; i < data.length - 3; i++) {
    if (data[i] === 0 && data[i+1] === 0 && data[i+2] === 0 && data[i+3] === 1) {
      if (start >= 0) units.push(data.slice(start, i));
      start = i + 4;
      i += 3;
    } else if (data[i] === 0 && data[i+1] === 0 && data[i+2] === 1) {
      if (start >= 0) units.push(data.slice(start, i));
      start = i + 3;
      i += 2;
    }
  }
  if (start >= 0) units.push(data.slice(start));
  return units;
}

let codecConfigured = false;
let pendingConfig = null;   // { sps, pps }

function handleFrame(data) {
  if (!decoder || decoder.state === 'closed') return;

  const nalUnits = splitNalUnits(data);
  let sps = null, pps = null, vcl = [];

  for (const nal of nalUnits) {
    if (!nal.length) continue;
    const type = nal[0] & 0x1f;
    if (type === 7) sps = nal;       // SPS
    else if (type === 8) pps = nal;  // PPS
    else vcl.push(nal);              // IDR / non-IDR
  }

  // Re-configure decoder when SPS/PPS arrive (key frame)
  if (sps && pps) {
    pendingConfig = { sps, pps };
    const desc = buildAVCC(sps, pps);
    const codecStr = parseSPSCodecString(sps);
    try {
      decoder.configure({
        codec: codecStr,
        description: desc,
        optimizeForLatency: true,
      });
      codecConfigured = true;
    } catch (e) {
      console.warn('decoder.configure failed:', e);
    }
  }

  if (!codecConfigured || !vcl.length) return;

  // Re-assemble as AVCC (4-byte length prefix) for EncodedVideoChunk.
  // VideoDecoder requires AVCC-format data when an AVCC `description` is set;
  // Annex B start codes cause an immediate "Decoder error." crash.
  let combined = new Uint8Array(vcl.reduce((acc, u) => acc + 4 + u.length, 0));
  let offset = 0;
  for (const u of vcl) {
    const len = u.length;
    combined[offset++] = (len >> 24) & 0xff;
    combined[offset++] = (len >> 16) & 0xff;
    combined[offset++] = (len >>  8) & 0xff;
    combined[offset++] =  len        & 0xff;
    combined.set(u, offset);
    offset += len;
  }

  const isKey = vcl.some(u => (u[0] & 0x1f) === 5);
  const chunk = new EncodedVideoChunk({
    type: isKey ? 'key' : 'delta',
    timestamp: performance.now() * 1000,
    data: combined,
  });

  try {
    decoder.decode(chunk);
  } catch (e) {
    console.warn('decode error:', e);
    codecConfigured = false;
  }
}

function buildAVCC(sps, pps) {
  const buf = new Uint8Array(11 + sps.length + pps.length);
  let o = 0;
  buf[o++] = 1;           // configurationVersion
  buf[o++] = sps[1];      // profile_idc
  buf[o++] = sps[2];      // profile_compatibility
  buf[o++] = sps[3];      // level_idc
  buf[o++] = 0xff;        // lengthSizeMinusOne = 3
  buf[o++] = 0xe1;        // numSequenceParameterSets = 1
  buf[o++] = (sps.length >> 8) & 0xff;
  buf[o++] = sps.length & 0xff;
  buf.set(sps, o); o += sps.length;
  buf[o++] = 1;           // numPictureParameterSets
  buf[o++] = (pps.length >> 8) & 0xff;
  buf[o++] = pps.length & 0xff;
  buf.set(pps, o);
  return buf.buffer;
}

function parseSPSCodecString(sps) {
  if (sps.length < 4) return 'avc1.640028';
  const p = sps[1].toString(16).padStart(2,'0');
  const c = sps[2].toString(16).padStart(2,'0');
  const l = sps[3].toString(16).padStart(2,'0');
  return `avc1.${p}${c}${l}`;
}

// ── Canvas draw ────────────────────────────────────────────────────────────

function drawFrame(frame) {
  const w = frame.displayWidth;
  const h = frame.displayHeight;
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  ctx.drawImage(frame, 0, 0);
  frameCount++;
}

// Render loop: draw the latest decoded frame at display refresh rate
function renderLoop() {
  if (pendingFrame) {
    drawFrame(pendingFrame);
    pendingFrame.close();
    pendingFrame = null;
  }
  requestAnimationFrame(renderLoop);
}
renderLoop();

// ── Coordinate mapping ─────────────────────────────────────────────────────

/**
 * Map a pointer position on the canvas element (CSS pixels) to
 * macOS screen coordinates (Cocoa points, origin bottom-left → CGEvent top-left).
 */
function canvasToScreen(clientX, clientY) {
  if (!windowMeta) return null;

  const rect = canvas.getBoundingClientRect();
  const relX = (clientX - rect.left) / rect.width;
  const relY = (clientY - rect.top)  / rect.height;

  // canvas pixel → logical window point (divide by contentScale for Retina)
  const logicalW = canvas.width  / windowMeta.contentScale;
  const logicalH = canvas.height / windowMeta.contentScale;

  const screenX = windowMeta.originX + relX * logicalW;
  const screenY = windowMeta.originY + relY * logicalH;

  return { x: screenX, y: screenY };
}

// ── Input forwarding ───────────────────────────────────────────────────────

wrap.addEventListener('mousemove', (e) => {
  // Move custom cursor
  const rect = wrap.getBoundingClientRect();
  cursor.style.left = (e.clientX - rect.left) + 'px';
  cursor.style.top  = (e.clientY - rect.top)  + 'px';
  cursor.style.opacity = '1';

  if (isDragging && dragStartCanvas && dragStartMeta) {
    // Window drag: compute delta in logical points
    const rect2 = canvas.getBoundingClientRect();
    const dx = (e.clientX - dragStartCanvas.x) / rect2.width  * (canvas.width  / dragStartMeta.contentScale);
    const dy = (e.clientY - dragStartCanvas.y) / rect2.height * (canvas.height / dragStartMeta.contentScale);
    sendInput({
      type: 'move',
      windowID: dragStartMeta.windowID,
      x: dragStartMeta.originX + dx,
      y: dragStartMeta.originY + dy,
    });
    return;
  }

  const pt = canvasToScreen(e.clientX, e.clientY);
  if (pt) sendInput({ type: 'mousemove', ...pt });
});

wrap.addEventListener('mouseleave', () => { cursor.style.opacity = '0'; });

wrap.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const relY = (e.clientY - rect.top) / rect.height;
  const logicalY = relY * (canvas.height / (windowMeta?.contentScale ?? 2));

  // If click in the top ~28pt = title bar → start drag
  if (logicalY < CHROME_HEIGHT && windowMeta) {
    isDragging = true;
    dragStartCanvas = { x: e.clientX, y: e.clientY };
    dragStartMeta = { ...windowMeta };
    return;
  }

  const pt = canvasToScreen(e.clientX, e.clientY);
  if (pt) sendInput({ type: 'mousedown', ...pt, button: e.button });
  e.preventDefault();
});

wrap.addEventListener('mouseup', (e) => {
  if (isDragging) {
    isDragging = false;
    dragStartCanvas = null;
    dragStartMeta = null;
    return;
  }
  const pt = canvasToScreen(e.clientX, e.clientY);
  if (pt) sendInput({ type: 'mouseup', ...pt, button: e.button });
});

wrap.addEventListener('click', (e) => {
  if (isDragging) return;
  const rect = canvas.getBoundingClientRect();
  const relY = (e.clientY - rect.top) / rect.height;
  const logicalY = relY * (canvas.height / (windowMeta?.contentScale ?? 2));
  if (logicalY < CHROME_HEIGHT) return;  // title bar click — no passthrough

  const pt = canvasToScreen(e.clientX, e.clientY);
  if (!pt) return;
  sendInput({
    type: 'click',
    ...pt,
    button: e.button,
    clickCount: 1,
    modifiers: buildModifiers(e),
  });
  e.preventDefault();
});

wrap.addEventListener('dblclick', (e) => {
  const pt = canvasToScreen(e.clientX, e.clientY);
  if (!pt) return;
  sendInput({ type: 'click', ...pt, button: e.button, clickCount: 2 });
  e.preventDefault();
});

wrap.addEventListener('wheel', (e) => {
  const pt = canvasToScreen(e.clientX, e.clientY);
  if (!pt) return;
  sendInput({ type: 'scroll', ...pt, deltaX: e.deltaX, deltaY: e.deltaY });
  e.preventDefault();
}, { passive: false });

wrap.addEventListener('contextmenu', (e) => e.preventDefault());

document.addEventListener('keydown', (e) => {
  if (document.activeElement === document.getElementById('server-url')) return;
  sendInput({
    type: 'keydown',
    keyCode: domKeyToVK(e.code),
    key: e.key,
    modifiers: buildModifiers(e),
  });
  // Don't preventDefault for Cmd+W, Cmd+T etc so browser still works
});

document.addEventListener('keyup', (e) => {
  if (document.activeElement === document.getElementById('server-url')) return;
  sendInput({
    type: 'keyup',
    keyCode: domKeyToVK(e.code),
    key: e.key,
    modifiers: buildModifiers(e),
  });
});

function buildModifiers(e) {
  const m = [];
  if (e.shiftKey)   m.push('shift');
  if (e.metaKey)    m.push('meta');
  if (e.altKey)     m.push('alt');
  if (e.ctrlKey)    m.push('ctrl');
  return m;
}

// Minimal DOM code → macOS virtual key code table
const VK_MAP = {
  'KeyA':0,'KeyB':11,'KeyC':8,'KeyD':2,'KeyE':14,'KeyF':3,'KeyG':5,
  'KeyH':4,'KeyI':34,'KeyJ':38,'KeyK':40,'KeyL':37,'KeyM':46,'KeyN':45,
  'KeyO':31,'KeyP':35,'KeyQ':12,'KeyR':15,'KeyS':1,'KeyT':17,'KeyU':32,
  'KeyV':9,'KeyW':13,'KeyX':7,'KeyY':16,'KeyZ':6,
  'Digit0':29,'Digit1':18,'Digit2':19,'Digit3':20,'Digit4':21,'Digit5':23,
  'Digit6':22,'Digit7':26,'Digit8':28,'Digit9':25,
  'Space':49,'Return':36,'Tab':48,'Backspace':51,'Escape':53,'Delete':117,
  'ArrowLeft':123,'ArrowRight':124,'ArrowDown':125,'ArrowUp':126,
  'Home':115,'End':119,'PageUp':116,'PageDown':121,
  'ShiftLeft':56,'ShiftRight':60,'MetaLeft':55,'MetaRight':54,
  'AltLeft':58,'AltRight':61,'ControlLeft':59,'ControlRight':62,
  'Period':47,'Comma':43,'Slash':44,'Semicolon':41,'Quote':39,
  'BracketLeft':33,'BracketRight':30,'Backslash':42,'Minus':27,'Equal':24,
  'F1':122,'F2':120,'F3':99,'F4':118,'F5':96,'F6':97,
  'F7':98,'F8':100,'F9':101,'F10':109,'F11':103,'F12':111,
};

function domKeyToVK(code) {
  return VK_MAP[code] ?? 0;
}

// ── Resize canvas to content size ──────────────────────────────────────────

// The canvas CSS fills the wrap; the HTML canvas pixel size is set by decoder output.

// ── Bootstrap ─────────────────────────────────────────────────────────────

document.getElementById('connect-btn').addEventListener('click', connect);
document.getElementById('server-url').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') connect();
});

// Auto-connect on load
connect();
</script>
</body>
</html>
